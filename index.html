<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Supply Chain Risk Predictor</title>
  <script>
    // Immediate CSS injection before page renders
    (function() {
      var links = [
        'https://raw.githubusercontent.com/testdemoqwenai2025-creator/AISupChn-preview/main/_next/static/chunks/34d933785a17edf3.css',
        'https://raw.githubusercontent.com/testdemoqwenai2025-creator/AISupChn-preview/main/_next/static/chunks/49b4eac33064f972.css'
      ];
      links.forEach(function(url) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, false); // Synchronous to block render until loaded
        xhr.send();
        if (xhr.status === 200) {
          var style = document.createElement('style');
          style.textContent = xhr.responseText;
          document.head.appendChild(style);
        }
      });
    })();
  </script>
</head>
<body>
  <div id="app">Loading AI Supply Chain Risk Predictor...</div>
  <script>
    // Load the actual app content
    fetch('https://raw.githubusercontent.com/testdemoqwenai2025-creator/AISupChn-preview/main/index.html?raw=1')
      .then(r => r.text())
      .then(html => {
        // Extract body content from the full HTML
        var parser = new DOMParser();
        var doc = parser.parseFromString(html, 'text/html');
        document.getElementById('app').innerHTML = doc.body.innerHTML;
        
        // Execute any scripts
        var scripts = doc.body.querySelectorAll('script');
        scripts.forEach(function(s) {
          var newScript = document.createElement('script');
          newScript.textContent = s.textContent;
          document.body.appendChild(newScript);
        });
      })
      .catch(err => console.error('Load error:', err));
  </script>
</body>
</html>
